[project]
name = "cloud-native-ai-lab"
version = "0.1.0"
requires-python = ">=3.11"
description = "Hands-on lab for AI workloads on Kubernetes"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["validate_*.py", "test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]

[dependency-groups]
dev = [
    "mypy>=2.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15",
    "types-PyYAML>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = false
