[project]
name = "cloud-native-ai-lab"
version = "0.1.0"
requires-python = ">=3.11"
description = "Hands-on lab for AI workloads on Kubernetes"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/e2e needs the network and runs only through the AGENTS.md `E2E command:`.
# norecursedirs keeps it out of `uv run pytest`; naming tests/e2e explicitly still collects it.
# The rest of the list restores pytest's defaults, which setting the option replaces.
norecursedirs = ["e2e", "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}"]
python_files = ["validate_*.py", "test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]

[dependency-groups]
dev = [
    "cel-python>=0.5.0",
    "mypy>=2.3",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16",
    "types-PyYAML>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = false
