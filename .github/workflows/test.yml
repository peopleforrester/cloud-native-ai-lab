# ABOUTME: CI pipeline that runs the full test suite on push and pull requests.
# ABOUTME: Uses uv for dependency management and pytest for test execution.

name: tests
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads and tests; it never pushes. Don't leave the
          # GITHUB_TOKEN behind in .git/config (zizmor "artipacked").
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv python install
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy tests/
      - run: uv run pytest -v --tb=short
