# ABOUTME: kmcp MCPServer that runs kagent's Kubernetes tools as an MCP server in the cluster.
# ABOUTME: Schema matches the kagent.dev/v1alpha1 MCPServer CRD that kagent-crds 0.10.3 bundles.

apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: kubernetes-tools
  namespace: agents
spec:
  # deployment describes the container that runs the MCP server. The kmcp
  # controller turns it into a Deployment and a Service.
  deployment:
    # kagent ships its Kubernetes MCP tools inside the consolidated
    # kagent-dev/kagent/tools image, which also bundles helm, prometheus,
    # argo, istio, cilium and kubescape tooling. 0.3.0 is the version the
    # kagent 0.10.3 Helm chart deploys.
    image: ghcr.io/kagent-dev/kagent/tools:0.3.0

    # cmd and args start the server. --stdio speaks MCP over stdin/stdout,
    # --tools=k8s registers only the Kubernetes tool set, and --read-only
    # leaves out every tool that changes the cluster.
    cmd: /tool-server
    args:
      - "--stdio"
      - "--tools=k8s"
      - "--read-only"

    # port is where the Service listens. With stdio transport, kmcp runs a
    # small adapter in the pod that accepts MCP over HTTP on this port and
    # passes it to the server's stdin/stdout.
    port: 3000

  # transportType is how the server itself speaks MCP:
  # - stdio: the server reads and writes MCP on stdin/stdout, and kmcp's
  #   adapter puts it on the network. Most published MCP servers work this way.
  # - http: the server listens for MCP over HTTP itself. Set httpTransport
  #   with its targetPort and path.
  transportType: stdio
  stdioTransport: {}
