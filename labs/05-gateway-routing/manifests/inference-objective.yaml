# ABOUTME: InferenceObjective assigns a routing priority to requests hitting an InferencePool.
# ABOUTME: Lives in llm-d, not the Gateway API Inference Extension, and is still alpha.

# The group here is llm-d.ai, not inference.networking.k8s.io. That matters and
# is easy to get wrong, because InferenceObjective and InferencePool are now
# owned by two different projects:
#
#   InferencePool       Gateway API Inference Extension   inference.networking.k8s.io/v1   GA
#   InferenceObjective  llm-d (llm-d-router)              llm-d.ai/v1alpha2                alpha
#
# History, because most tutorials still get this wrong. GAIE v1.0.0 replaced the
# older InferenceModel kind with InferenceObjective, but only InferencePool was
# promoted to the GA group in that release. InferenceObjective stayed
# experimental at inference.networking.x-k8s.io/v1alpha2 for its whole life in
# GAIE, and v1.6.0 removed it and handed it to llm-d. There has never been an
# InferenceObjective served at inference.networking.k8s.io/v1.
apiVersion: llm-d.ai/v1alpha2
kind: InferenceObjective
metadata:
  name: coding-model
  namespace: inference-demo
spec:
  # priority replaced the old Critical / BestEffort criticality enum with a
  # plain integer. Higher is more important, negative values are allowed, and
  # an unset value is treated as 0 by the Endpoint Picker. There is no fixed
  # translation from the old enum: pick numbers that express the ordering you
  # want. A request at priority 10 is always served ahead of one at 0.
  priority: 2

  # poolRef points at the InferencePool that serves this objective, and the pool
  # must live in the same namespace. group and kind both have defaults
  # (inference.networking.k8s.io and InferencePool), and are written out here so
  # the cross-project boundary is visible rather than implied.
  poolRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: llm-pool
