# ABOUTME: Sample Kubernetes Job that Kueue manages via queue-name label.
# ABOUTME: Simulates a workload using busybox sleep for demonstration purposes.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: sample-job-
  labels:
    # This label tells Kueue which LocalQueue should manage this job.
    # Kueue intercepts jobs with this label and holds them until admitted.
    kueue.x-k8s.io/queue-name: team-a-lq
spec:
  parallelism: 1
  completions: 1
  # Kueue sets suspend to false when it admits the job.
  # Submit the job with suspend: true so Kueue controls when it starts.
  suspend: true
  template:
    spec:
      # Pod-level securityContext applies to every container in the pod.
      # This is a teaching example — the pattern is the same for any workload.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534          # nobody — present in nearly every base image
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: busybox:1.36
          # Container-level securityContext layers on top of the pod-level block.
          # Drop every capability; this workload only needs to read its own
          # binaries and write to stdout, so an immutable root filesystem is safe.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c"]
          args:
            - |
              echo "Job started at $(date)"
              echo "Simulating work for 30 seconds..."
              sleep 30
              echo "Job completed at $(date)"
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
      restartPolicy: Never
  backoffLimit: 0
